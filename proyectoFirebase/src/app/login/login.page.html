<ion-header>
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-input placeholder="Email" [(ngModel)]="email"></ion-input>
  <ion-input placeholder="Contraseña" [(ngModel)]="password" type="password"></ion-input>

  <ion-button expand="block" (click)="login()">Ingresar</ion-button>
</ion-content>
